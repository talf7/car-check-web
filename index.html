<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחיר בדיקה לפני קנייה</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='26' width='56' height='24' rx='7' fill='%233b82f6'/%3E%3Cpolygon points='15,26 20,12 44,12 49,26' fill='%231d4ed8'/%3E%3Cpolygon points='22,25 27,13 19,13 17,25' fill='%2393c5fd'/%3E%3Cpolygon points='42,25 47,25 45,13 37,13' fill='%2393c5fd'/%3E%3Ccircle cx='18' cy='52' r='9' fill='%231e293b'/%3E%3Ccircle cx='46' cy='52' r='9' fill='%231e293b'/%3E%3Ccircle cx='18' cy='52' r='4' fill='%2394a3b8'/%3E%3Ccircle cx='46' cy='52' r='4' fill='%2394a3b8'/%3E%3Ccircle cx='57' cy='36' r='4' fill='%23fde68a'/%3E%3Ccircle cx='7' cy='36' r='4' fill='%23ef4444'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 28px;
    text-align: center;
  }

  .search-row {
    display: flex;
    gap: 10px;
    flex-direction: row-reverse;
    width: 100%;
    max-width: 420px;
    margin-bottom: 14px;
  }

  #plate {
    flex: 1;
    padding: 12px 16px;
    font-size: 1.1rem;
    border-radius: 8px;
    border: 1px solid #3a3a5c;
    background: #16213e;
    color: #fff;
    text-align: center;
    outline: none;
    direction: ltr;
  }
  #plate:focus { border-color: #3b82f6; }
  #plate::placeholder { color: #666; direction: rtl; }

  #searchBtn {
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  #searchBtn:hover:not(:disabled) { background: #2563eb; }
  #searchBtn:disabled { background: #334155; cursor: default; }

  #status {
    font-size: 0.95rem;
    min-height: 22px;
    text-align: center;
    margin-bottom: 10px;
  }

  #errorDetail {
    display: none;
    width: 100%;
    max-width: 480px;
    font-size: 0.8rem;
    line-height: 1.5;
    color: #64748b;
    text-align: center;
    margin-bottom: 12px;
    direction: ltr;
    word-break: break-word;
  }

  .warning-box {
    display: none;
    width: 100%;
    max-width: 480px;
    background: #2a1a00;
    border: 1px solid #f59e0b;
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
    color: #f59e0b;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .result-card {
    display: none;
    width: 100%;
    max-width: 480px;
    background: #16213e;
    border: 1px solid #3a3a5c;
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 10px;
  }

  .price-line {
    font-size: 1.5rem;
    font-weight: 700;
    color: #4CAF50;
    text-align: center;
    margin-bottom: 18px;
    min-height: 2rem;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #2a2a4a;
    font-size: 1rem;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #94a3b8; }
  .detail-value { font-weight: 600; color: #e2e8f0; }

  .battery-card {
    display: none;
    width: 100%;
    max-width: 480px;
    background: #1e2a1e;
    border: 1px solid #2d5a2d;
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
    color: #6fcf6f;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
  }

  @media (max-width: 500px) {
    h1 { font-size: 1.5rem; }
    .result-card { padding: 18px 16px; }
  }
</style>
</head>
<body>

<h1>מחיר בדיקה לפני קנייה 🚗</h1>

<div class="search-row">
  <input id="plate" type="text" placeholder="מספר רישוי" maxlength="8" inputmode="numeric">
  <button id="searchBtn" onclick="doSearch()">חפש</button>
</div>

<div id="status"></div>

<div id="errorDetail"></div>

<div class="warning-box" id="warningBox"></div>

<div class="result-card" id="resultCard">
  <div class="price-line" id="priceLine"></div>
  <div class="detail-row"><span class="detail-label">קבוצת אגרה</span><span class="detail-value" id="dGroup">—</span></div>
  <div class="detail-row"><span class="detail-label">סוג הנעה</span><span class="detail-value" id="dDrive">—</span></div>
  <div class="detail-row"><span class="detail-label">סוג רכב</span><span class="detail-value" id="dType">—</span></div>
  <div class="detail-row"><span class="detail-label">מרכב</span><span class="detail-value" id="dBody">—</span></div>
  <div class="detail-row"><span class="detail-label">מקומות ישיבה (למעט נהג)</span><span class="detail-value" id="dSeats">—</span></div>
</div>

<div class="battery-card" id="batteryCard"></div>

<script>
const API      = "https://data.gov.il/api/3/action/datastore_search";
const RES_REG  = "053cea08-09bc-40ec-8f7a-156f0677aff3";
const RES_WLTP = "142afde2-6228-49f9-8a29-9b6c3a0cbe40";

// A request that never returns is indistinguishable from a hang to the user,
// so cap every call instead of leaving the button stuck on "מחפש...".
const TIMEOUT_MS = 15000;

// WLTP sug_degem: M=נוסעים (M-category), N=מסחרי (N-category commercial)
const DEGEM_LABEL = { M: "נוסעים", N: "מסחרי", L: "אופנוע", T: "טרקטור", O: "נגרר" };

// Three very different problems used to surface as one "communication error":
// the request never reaching data.gov.il, data.gov.il answering with an error
// status, and data.gov.il answering with something that is not JSON (a block
// or challenge page). They are separated here so the UI can name the real one.
class NetworkError extends Error {
  constructor(cause) { super(String(cause && cause.message || cause)); this.name = "NetworkError"; this.cause = cause; }
}
class TimeoutError extends Error {
  constructor() { super(`timeout after ${TIMEOUT_MS}ms`); this.name = "TimeoutError"; }
}
class HttpError extends Error {
  constructor(status) { super(`HTTP ${status}`); this.name = "HttpError"; this.status = status; }
}
class ParseError extends Error {
  constructor(cause) { super(String(cause && cause.message || cause)); this.name = "ParseError"; this.cause = cause; }
}

function apiUrl(resourceId, filters, limit) {
  const params = new URLSearchParams({
    resource_id: resourceId,
    filters: JSON.stringify(filters),
    limit,
  });
  return `${API}?${params}`;
}

// AbortSignal.timeout is unavailable on older browsers; there the request
// simply runs uncapped rather than throwing while building the options.
function timeoutSignal() {
  return (typeof AbortSignal !== "undefined" && AbortSignal.timeout)
    ? AbortSignal.timeout(TIMEOUT_MS)
    : undefined;
}

async function apiGet(resourceId, filters, limit = 1) {
  const url = apiUrl(resourceId, filters, limit);

  let res;
  try {
    res = await fetch(url, { signal: timeoutSignal() });
  } catch (e) {
    // A cross-origin block and an unreachable host both land here as the same
    // opaque TypeError — the browser withholds the reason from the page.
    if (e && (e.name === "TimeoutError" || e.name === "AbortError")) throw new TimeoutError();
    throw new NetworkError(e);
  }

  if (!res.ok) throw new HttpError(res.status);

  try {
    const data = await res.json();
    return (data.result || {}).records || [];
  } catch (e) {
    throw new ParseError(e);
  }
}

// The browser refuses to tell a page why a cross-origin fetch failed, so probe
// the host with mode:"no-cors": that resolves (opaquely) whenever the request
// actually reached data.gov.il, and rejects when nothing got through. A resolved
// probe therefore means the connection is fine and the request itself is being
// rejected — by CORS on the browser side or by a block on the server side.
async function probeReachable() {
  try {
    await fetch(apiUrl(RES_REG, {}, 1), { mode: "no-cors", signal: timeoutSignal() });
    return true;
  } catch (e) {
    return false;
  }
}

// Turns a failure into the message the user sees plus the technical line under
// it, so a report says what actually broke instead of "communication error".
async function describeFailure(err) {
  if (err instanceof TimeoutError) {
    return { msg: "data.gov.il לא הגיב בזמן — נסה שוב", detail: `timeout ${TIMEOUT_MS}ms` };
  }

  if (err instanceof HttpError) {
    const s = err.status;
    if (s === 403 || s === 401) return { msg: "השרת של data.gov.il חסם את הבקשה", detail: `HTTP ${s}` };
    if (s === 429)              return { msg: "יותר מדי בקשות — המתן רגע ונסה שוב", detail: "HTTP 429" };
    if (s === 404)              return { msg: "מאגר הנתונים לא נמצא — ייתכן שהמזהה השתנה", detail: `HTTP 404 (resource_id)` };
    if (s >= 500)               return { msg: "תקלה בשרת data.gov.il — נסה שוב מאוחר יותר", detail: `HTTP ${s}` };
    return { msg: `השרת החזיר שגיאה (${s})`, detail: `HTTP ${s}` };
  }

  if (err instanceof ParseError) {
    return {
      msg: "השרת החזיר תשובה לא תקינה (ככל הנראה דף חסימה ולא נתונים)",
      detail: `response is not JSON — ${err.message}`,
    };
  }

  if (err instanceof NetworkError) {
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      return { msg: "אין חיבור לאינטרנט", detail: "navigator.onLine = false" };
    }
    const reachable = await probeReachable();
    if (reachable) {
      return {
        msg: "החיבור תקין, אך הדפדפן חסם את התשובה מ-data.gov.il (CORS)",
        detail: `fetch rejected but host is reachable — CORS headers missing or request blocked upstream (${err.message})`,
      };
    }
    return {
      msg: "לא ניתן להגיע ל-data.gov.il — בדוק חיבור, VPN או חוסם פרסומות",
      detail: `fetch rejected, host unreachable (${err.message})`,
    };
  }

  return { msg: "שגיאה לא צפויה", detail: `${err && err.name || "Error"}: ${err && err.message || err}` };
}

// True if a record field carries a usable filter value (0 counts as valid).
function hasValue(v) {
  return v !== undefined && v !== null && String(v).trim() !== "";
}

// Parse a datastore numeric field. Values arrive as number or string
// ("3", "3.0", " 3 ") depending on the record. Returns null if unparseable.
function toInt(v) {
  if (v === undefined || v === null) return null;
  const n = Number(String(v).trim());
  return Number.isFinite(n) ? Math.trunc(n) : null;
}

// Find the WLTP row for this vehicle's *exact* variant.
//
// The WLTP resource holds MANY rows per (tozeret_cd, degem_nm) — one per
// trim/drive/year variant, differing in hanaa_nm (4X2 vs 4X4), kvuzat_agra_cd
// and more. Filtering on that pair alone returns an arbitrary variant, which is
// what produced wrong drive types, wrong fee groups and therefore wrong prices.
// The registration record carries degem_cd — the exact variant code, mapping
// 1:1 to the WLTP row — plus shnat_yitzur / ramat_gimur to pin it down.
//
// Filters degrade strictest → loosest: trim and year are relaxed first and
// degem_cd is dropped last, so gaps in the dataset still resolve. Returns
// { rec, exact }; exact is true only when degem_cd pinned the row down, and
// when it is false the caller must not present the price as final.
async function fetchWltpRecord(reg) {
  if (!(hasValue(reg.tozeret_cd) && hasValue(reg.degem_nm))) {
    return { rec: null, exact: false };
  }

  const base    = { tozeret_cd: reg.tozeret_cd, degem_nm: reg.degem_nm };
  const degemCd = hasValue(reg.degem_cd)     ? { degem_cd: reg.degem_cd }         : {};
  const year    = hasValue(reg.shnat_yitzur) ? { shnat_yitzur: reg.shnat_yitzur } : {};
  const trim    = hasValue(reg.ramat_gimur)  ? { ramat_gimur: reg.ramat_gimur }   : {};

  const attempts = [
    { ...degemCd, ...year, ...trim },
    { ...degemCd, ...year },
    { ...degemCd },
    {},  // last resort: (tozeret_cd, degem_nm) only
  ];

  const seen = new Set();
  for (const extra of attempts) {
    const filters = { ...base, ...extra };
    const key = JSON.stringify(filters);
    if (seen.has(key)) continue;   // de-dupe when degem_cd/year are absent
    seen.add(key);
    try {
      const recs = await apiGet(RES_WLTP, filters, 1);
      if (recs.length) return { rec: recs[0], exact: "degem_cd" in filters };
    } catch (e) {
      // A rejected filter (the dataset lacks the column, or the value is the
      // wrong type) is expected here — that is what the looser attempts are
      // for. A comms failure is not: retrying it just stalls the search and
      // would end up reported as "no data for this model", so surface it.
      if (e instanceof HttpError && e.status < 500) continue;
      throw e;
    }
  }
  return { rec: null, exact: false };
}

async function fetchVehicle(plate) {
  const regRecs = await apiGet(RES_REG, { mispar_rechev: plate }, 1);
  if (!regRecs.length) return { status: "not_found" };
  const reg = regRecs[0];

  const sug_delek = reg.sug_delek_nm || "";
  // reg.sug_degem = ownership type (P=private person, M=company) — NOT vehicle
  // category, so it is never carried through to the commercial check.

  // Fee group as carried by the registration record, used when the WLTP row is
  // missing or omits it. The dataset spells it both ways, so accept either.
  const regAgra = [reg.kvutzat_agra, reg.kvuzat_agra_cd].find(hasValue) ?? null;

  const { rec, exact } = await fetchWltpRecord(reg);
  if (rec) {
    // sug_degem kept from WLTP (M=נוסעים, N=מסחרי) — never overridden with REG's.
    const data = { ...rec, sug_delek_nm: sug_delek, _variantExact: exact };
    if (!hasValue(data.kvuzat_agra_cd) && regAgra !== null) {
      data.kvuzat_agra_cd = regAgra;
    }
    return { status: "ok", data };
  }

  // No WLTP variant matched, but the fee group alone still supports a price.
  if (regAgra !== null) {
    return { status: "partial", data: { sug_delek_nm: sug_delek, kvuzat_agra_cd: regAgra } };
  }

  return { status: "no_wltp", data: { sug_delek_nm: sug_delek } };
}

function getPrice(group, hanaa, merkav) {
  const g = toInt(group);
  if (!g) return null;
  const is4x4  = String(hanaa || "").trim().toUpperCase() === "4X4";
  const isMini = merkav && merkav.includes("מיני");
  if (is4x4)  return g <= 3 ? 860  : g <= 5 ? 1000 : g === 6 ? 1300 : 1500;
  if (isMini) return g <= 5 ? 860  : 1250;
  return           g <= 3 ? 600  : g <= 5 ? 690  : g === 6 ? 860  : 1250;
}

function isCommercial(merkav, sug_degem) {
  if ((merkav || "").includes("מסחרי")) return true;
  // WLTP sug_degem: N=מסחרי (N-category). M=נוסעים (passenger). REG M=company-owned (not vehicle type).
  if ((sug_degem || "").trim().toUpperCase() === "N") return true;
  return false;
}

function isPriceCheckWarning(merkav, mispar_moshavim) {
  const m = (merkav || "").toUpperCase();
  if (m.includes("MPV") || (merkav || "").includes("אחוד")) return true;
  const seats = toInt(mispar_moshavim);
  if (seats !== null && seats - 1 >= 6) return true;
  return false;
}

function getBattery(sug_delek) {
  const f = sug_delek || "";
  if (f.includes("חשמל"))   return { label: "בדיקת סוללה לרכב חשמלי",  price: 450 };
  if (f.includes("היברידי") || f.includes("היבריד")) return { label: "בדיקת סוללה לרכב היברידי", price: 300 };
  return null;
}

function setStatus(msg, color) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.style.color = color || "#94a3b8";
}

// Technical one-liner shown under a failure message. Keeps the cause visible
// to whoever has to fix it without needing the browser console.
function setErrorDetail(text) {
  const el = document.getElementById("errorDetail");
  el.textContent = text || "";
  el.style.display = text ? "block" : "none";
}

function hide(...ids) { ids.forEach(id => { document.getElementById(id).style.display = "none"; }); }
function show(id, display = "block") { document.getElementById(id).style.display = display; }

async function doSearch() {
  const plate = document.getElementById("plate").value.trim();
  if (!plate) { setStatus("נא להכניס מספר רישוי", "orange"); return; }
  if (!/^\d{5,8}$/.test(plate)) { setStatus("מספר רישוי לא תקין — 5 עד 8 ספרות", "orange"); return; }

  const btn = document.getElementById("searchBtn");
  btn.disabled = true;
  btn.textContent = "מחפש...";
  setStatus("מחפש...", "#94a3b8");
  setErrorDetail("");
  hide("warningBox", "resultCard", "batteryCard");

  try {
    const { status, data } = await fetchVehicle(plate);

    if (status === "not_found") {
      setStatus("הרכב לא נמצא במאגר", "orange");
      return;
    }

    if (status === "no_wltp" || !data) {
      setStatus("לא ניתן לחשב מחיר — נתוני הרכב אינם זמינים", "orange");
      showBattery(data?.sug_delek_nm || "");
      return;
    }

    if (status === "partial") {
      // No WLTP variant matched, but the registration record carried the fee
      // group — enough for a price. Drive type and body are unknown here, so
      // the 4X4 and mini tiers cannot be ruled out: this is a floor, not a quote.
      setPrice(getPrice(data.kvuzat_agra_cd, "", ""));
      document.getElementById("dGroup").textContent = data.kvuzat_agra_cd || "—";
      ["dDrive", "dType", "dBody", "dSeats"].forEach(id => {
        document.getElementById(id).textContent = "—";
      });
      setStatus("נתונים טכניים מלאים אינם זמינים לדגם זה", "orange");
      document.getElementById("warningBox").textContent = "יש לברר מחיר מדויק";
      show("warningBox");
      show("resultCard", "block");
      showBattery(data.sug_delek_nm || "");
      return;
    }

    const { kvuzat_agra_cd, hanaa_nm, merkav, sug_delek_nm, sug_degem, mispar_moshavim } = data;

    document.getElementById("dGroup").textContent = kvuzat_agra_cd || "—";
    document.getElementById("dDrive").textContent = hanaa_nm       || "—";
    document.getElementById("dType").textContent  = DEGEM_LABEL[sug_degem] || sug_degem || "—";
    document.getElementById("dBody").textContent  = merkav         || "—";
    const seats = toInt(mispar_moshavim);
    document.getElementById("dSeats").textContent = seats !== null ? seats - 1 : "—";

    if (isCommercial(merkav, sug_degem)) {
      document.getElementById("priceLine").textContent = "";
      document.getElementById("priceLine").style.color = "orange";
      document.getElementById("warningBox").textContent = "הרכב הינו מסחרי — יש לברר מחיר מדויק";
      show("warningBox");
      show("resultCard", "block");
      setStatus("", "");
      showBattery(sug_delek_nm);
      return;
    }

    const priceCheckWarn = isPriceCheckWarning(merkav, mispar_moshavim);
    if (priceCheckWarn) {
      document.getElementById("priceLine").textContent = "";
      document.getElementById("warningBox").textContent = "יש לברר מחיר מדויק";
      show("warningBox");
    } else {
      setPrice(getPrice(kvuzat_agra_cd, hanaa_nm, merkav));
      // degem_cd could not pin the row to this exact variant, so hanaa_nm and
      // kvuzat_agra_cd may belong to a different version of this model. Show
      // the figure, but never as a final price.
      if (!data._variantExact) {
        document.getElementById("warningBox").textContent = "יש לברר מחיר מדויק";
        show("warningBox");
      }
    }

    setStatus("", "");
    show("resultCard", "block");
    showBattery(sug_delek_nm);

  } catch (e) {
    console.error("[car-check] search failed:", e);
    const { msg, detail } = await describeFailure(e);
    setStatus(msg, "red");
    setErrorDetail(detail);
  } finally {
    btn.disabled = false;
    btn.textContent = "חפש";
  }
}

function setPrice(price) {
  const priceLine = document.getElementById("priceLine");
  if (price) {
    priceLine.textContent = `עלות בדיקה: ₪${price.toLocaleString()}`;
    priceLine.style.color = "#4CAF50";
  } else {
    priceLine.textContent = "לא ניתן לחשב עלות — סוג רכב לא מזוהה";
    priceLine.style.color = "orange";
  }
}

function showBattery(sug_delek) {
  const b = getBattery(sug_delek);
  const card = document.getElementById("batteryCard");
  if (b) {
    card.textContent = `${b.label}:   ₪${b.price.toLocaleString()}`;
    show("batteryCard");
  } else {
    hide("batteryCard");
  }
}

document.getElementById("plate").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});
</script>

</body>
</html>
